name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install Dependencies
        run: yarn install --immutable

      # prepack runs the build, so lib/ inside the tarball is always current.
      # Requires the NPM_TOKEN repository secret: an npm automation token with
      # publish rights on the @dekzypedia scope.
      - name: Publish @dekzypedia/baileys to npm
        run: npm publish --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack release asset
        run: |
          yarn pack
          mv ./*.tgz dekzypedia-baileys.tgz

      - name: Create GitHub release
        uses: meeDamian/github-release@2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          commitish: ${{ github.sha }}
          name: ${{ github.ref_name }}
          body: Fork release of @dekzypedia/baileys ${{ github.ref_name }}
          files: dekzypedia-baileys.tgz
          gzip: folders
          allow_override: true
