name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install Dependencies
        run: yarn install --immutable

      # A tag push carries its own tag name; a manual run has to derive it from
      # package.json so the GitHub release still lands on a v* tag.
      - name: Resolve release tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag}" != "v${version}" ]; then
              echo "Tag ${tag} does not match package.json version ${version}" >&2
              exit 1
            fi
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # prepack runs the build, so lib/ inside the tarball is always current.
      # Requires the NPM_TOKEN repository secret: an npm automation token with
      # publish rights on the @dekzypedia scope.
      - name: Publish @dekzypedia/baileys to npm
        run: npm publish --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack release asset
        run: |
          yarn pack
          mv ./*.tgz dekzypedia-baileys.tgz

      - name: Create GitHub release
        uses: meeDamian/github-release@2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
          commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body: Fork release of @dekzypedia/baileys ${{ steps.release.outputs.version }}
          files: dekzypedia-baileys.tgz
          gzip: folders
          allow_override: true
