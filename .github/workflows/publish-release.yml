name: Publish Release

on:
  push:
    tags:
      - 'v*'
    # Lets a maintainer release from an environment that can push branches but
    # not tags; the tag is derived from package.json in the resolve step below.
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 ships npm 11, which is the floor for trusted publishing (OIDC).
      # No registry-url here: it writes an .npmrc that needs NODE_AUTH_TOKEN,
      # which this workflow no longer carries.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install Dependencies
        run: yarn install --immutable

      # A tag push carries its own tag name; a manual run has to derive it from
      # package.json so the GitHub release still lands on a v* tag.
      - name: Resolve release tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag}" != "v${version}" ]; then
              echo "Tag ${tag} does not match package.json version ${version}" >&2
              exit 1
            fi
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # prepack runs the build, so lib/ inside the tarball is always current.
      # Authenticates through trusted publishing: npm exchanges the workflow's
      # OIDC token (needs id-token: write above) for a short-lived credential, so
      # there is no NPM_TOKEN to rotate. Requires a trusted publisher on
      # npmjs.com for this package pointing at dekzypedia/baileys and this
      # workflow file, with direct publishing allowed.
      - name: Publish @dekzypedia/baileys to npm
        run: |
          echo "npm $(npm --version)"
          npm publish --access public --provenance --tag latest

      - name: Pack release asset
        run: |
          yarn pack
          mv ./*.tgz dekzypedia-baileys.tgz

      - name: Create GitHub release
        uses: meeDamian/github-release@2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
          commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body: Fork release of @dekzypedia/baileys ${{ steps.release.outputs.version }}
          files: dekzypedia-baileys.tgz
          gzip: folders
          allow_override: true
